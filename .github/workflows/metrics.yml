name: Update profile metrics

on:
  push:
    branches:
      - main
    paths-ignore:
      - github-metrics.svg
      - language-metrics.svg
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate profile metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Dyrits
          filename: github-metrics.svg
          template: classic
          base: header, activity, community
          config_timezone: Europe/Paris
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  languages:
    needs: metrics
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate language metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Dyrits
          METRICS_VERSION: ${{ github.run_id }}
        run: node .github/scripts/generate-language-metrics.mjs

      - name: Commit updated language metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md language-metrics.svg
          git diff --cached --quiet || git commit -m "chore: update profile metrics [skip ci]"
          git push
